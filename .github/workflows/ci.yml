name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=low
      - run: pnpm check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
      - run: pnpm release:artifacts
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: chrome-extension
          path: release/*
          if-no-files-found: error
          include-hidden-files: true
      - name: Verify release artifact download
        uses: actions/download-artifact@v8.0.2
        with:
          name: chrome-extension
          path: .output/downloaded-release
      - name: Verify downloaded release checksums
        working-directory: .output/downloaded-release
        run: sha256sum -c SHA256SUMS
  runtime-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['24.15.0', '26']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
